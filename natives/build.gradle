plugins {
  id 'de.undercouch.download'
}

import org.apache.tools.ant.taskdefs.condition.Os

import java.util.regex.Pattern

apply plugin: 'de.undercouch.download'

apply from: 'natives.gradle'

ext.opusVersion = '1.5.2'
ext.mpg123Version = '1.33.7'
ext.oggVersion = '1.3.6'
ext.vorbisVersion = '1.3.7'
ext.sampleRateVersion = '0.2.2'
ext.fdkAacVersion = '2.0.3'

task load { doLast {
  if (!file("$projectDir/samplerate/include/samplerate.h").exists()) {
    def downloadPath = "$buildDir/tmp/libsamplerate-${sampleRateVersion}.tar.gz"
    def unpackPath = "$buildDir/tmp"

    download.run {
      src "https://github.com/libsndfile/libsamplerate/archive/refs/tags/${sampleRateVersion}.tar.gz"
      dest downloadPath
    }

    copy {
      from tarTree(resources.gzip(downloadPath))
      into unpackPath
    }

    copy {
      from "$unpackPath/libsamplerate-${sampleRateVersion}/src"
      into "$projectDir/samplerate/src"
    }

    copy {
      from "$unpackPath/libsamplerate-${sampleRateVersion}/include"
      into "$projectDir/samplerate/include"
    }
  }

  if (!file("$projectDir/fdk-aac/libAACdec").exists()) {
    def downloadPath = "$buildDir/tmp/fdk-aac-v${fdkAacVersion}.tar.gz"
    def unpackPath = "$buildDir/tmp"

    download.run {
      src "https://github.com/mstorsjo/fdk-aac/archive/refs/tags/v${fdkAacVersion}.tar.gz"
      dest downloadPath
    }

    copy {
      from tarTree(resources.gzip(downloadPath))
      into unpackPath
    }

    copy {
      from "$unpackPath/fdk-aac-${fdkAacVersion}"
      into "$projectDir/fdk-aac"
      exclude 'CMakeLists.txt'
    }
  }

  if (!file("$projectDir/vorbis/libogg-${oggVersion}").exists()) {
    def downloadPath = "$buildDir/tmp/libogg-${oggVersion}.tar.gz"
    def unpackPath = "$buildDir/tmp"

    download.run {
      src "https://downloads.xiph.org/releases/ogg/libogg-${oggVersion}.tar.gz"
      dest downloadPath
    }

    copy {
      from tarTree(resources.gzip(downloadPath))
      into unpackPath
    }

    copy {
      from "$unpackPath/libogg-${oggVersion}"
      into "$projectDir/vorbis/libogg-${oggVersion}"
    }
  }

  if (!file("$projectDir/vorbis/libvorbis-${vorbisVersion}").exists()) {
    def downloadPath = "$buildDir/tmp/libvorbis-${vorbisVersion}.tar.gz"
    def unpackPath = "$buildDir/tmp"

    download.run {
      src "https://downloads.xiph.org/releases/vorbis/libvorbis-${vorbisVersion}.tar.gz"
      dest downloadPath
    }

    copy {
      from tarTree(resources.gzip(downloadPath))
      into unpackPath
    }

    copy {
      from "$unpackPath/libvorbis-${vorbisVersion}"
      into "$projectDir/vorbis/libvorbis-${vorbisVersion}"
    }
  }

  if (!file("$projectDir/opus/opus-${opusVersion}").exists()) {
    def downloadPath = "$buildDir/tmp/opus-${opusVersion}.tar.gz"
    def unpackPath = "$buildDir/tmp"

    download.run {
      src "https://github.com/xiph/opus/releases/download/v${opusVersion}/opus-${opusVersion}.tar.gz"
      dest downloadPath
    }

    copy {
      from tarTree(resources.gzip(downloadPath))
      into unpackPath
    }

    copy {
      from "$unpackPath/opus-${opusVersion}"
      into "$projectDir/opus/opus-${opusVersion}"
    }
  }

  if (!Os.isFamily(Os.FAMILY_WINDOWS) && !file("$projectDir/mp3/mpg123-${mpg123Version}").exists()) {
    def downloadPath = "$buildDir/tmp/mpg123-${mpg123Version}.tar.bz2"
    def unpackPath = "$buildDir/tmp"

    download.run {
      src "https://www.mpg123.de/download/mpg123-${mpg123Version}.tar.bz2"
      dest downloadPath
    }

    copy {
      from tarTree(resources.bzip2(downloadPath))
      into unpackPath
    }

    copy {
      from "$unpackPath/mpg123-${mpg123Version}"
      into "$projectDir/mp3/mpg123-${mpg123Version}"
    }
  }
}}

def buildOpusOnWindows(force) {
  def target = project.findProperty('nativeTarget') ?: System.getenv('NATIVE_TARGET')
  def is32Bit = (target == "win-x86")
  def archFolder = is32Bit ? "32" : "64"
  def base = "$projectDir/libs/${archFolder}"
  def libs = ['opus']
  def present = libs.every { file("${base}/${it}.lib").exists() }

  if (force || !present) {
    file(base).mkdirs()
    def opusBuildDir = file("$buildDir/opus-build")
    opusBuildDir.deleteDir()
    opusBuildDir.mkdirs()

    def cmakeArch = is32Bit ? 'Win32' : 'x64'
    def process = ['cmake', '-B', opusBuildDir.absolutePath, '-S', "$projectDir/opus/opus-${opusVersion}",
                   '-DCMAKE_BUILD_TYPE=Release', '-A', cmakeArch,
                   '-DOPUS_BUILD_PROGRAMS=OFF', '-DOPUS_BUILD_TESTING=OFF',
                   '-DBUILD_SHARED_LIBS=OFF', '-DOPUS_STATIC_RUNTIME=ON'].
        execute(null as String[], projectDir)
    waitForAndCheckSuccess(process, "Opus CMake config")

    process = ['cmake', '--build', opusBuildDir.absolutePath, '--config', 'Release'].
        execute(null as String[], projectDir)
    waitForAndCheckSuccess(process, "Opus CMake build")

    copy {
      from "${opusBuildDir.absolutePath}/Release/opus.lib"
      into base
    }
  }
}

def buildMpg123OnWindows(force) {
  def target = project.findProperty('nativeTarget') ?: System.getenv('NATIVE_TARGET')
  def is32Bit = (target == "win-x86")
  def archFolder = is32Bit ? "32" : "64"
  def base = "$projectDir/libs/${archFolder}"
  def libFile = file("${base}/mpg123.lib")
  def dllFile = file("${project(':natives-publish').projectDir}/src/main/resources/natives/${is32Bit ? 'win-x86' : 'win-x86-64'}/libmpg123-0.dll")

  if ((force || !libFile.exists()) && dllFile.exists()) {
    file(base).mkdirs()
    def defFile = file("${base}/mpg123.def")
    defFile.text = "LIBRARY libmpg123-0.dll\nEXPORTS\nmpg123_init\nmpg123_new\nmpg123_delete\nmpg123_open_feed\nmpg123_close\nmpg123_decode\n"

    def vswherePath = "${System.getenv('ProgramFiles(x86)')}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
    def libExe = "lib.exe"
    if (file(vswherePath).exists()) {
      def proc = [vswherePath, '-latest', '-products', '*', '-find', 'VC/Tools/MSVC/**/bin/Hostx64/x64/lib.exe'].execute()
      def out = proc.text.trim()
      if (!out.isEmpty()) {
        libExe = out.split('\\r?\\n')[0]
      }
    }
    def machineFlag = is32Bit ? "/machine:x86" : "/machine:x64"
    def proc = [libExe, "/def:${defFile.absolutePath}", "/out:${libFile.absolutePath}", machineFlag].execute(null as String[], file(base))
    proc.waitForProcessOutput(System.out as Appendable, System.err)
  }
}

def waitForAndCheckSuccess(process, name) {
  process.waitForProcessOutput(System.out as Appendable, System.err)

  if (process.exitValue() != 0) {
    throw new IllegalStateException("${name} failed.")
  }
}

def buildOpusOnLinux(force) {
  def target = project.findProperty('nativeTarget') ?: System.getenv('NATIVE_TARGET')
  def is32Bit = (target == "linux-x86" || target == "linux-armhf" || target == "linux-arm" || target == "linux-aarch32")
  def archFolder = is32Bit ? "32" : "64"
  def present = file("${projectDir}/libs/${archFolder}/libopus.a").exists()

  if (force || !present) {
    file("${projectDir}/libs/${archFolder}").mkdirs()
    def opusBuildDir = file("$buildDir/opus-build")
    opusBuildDir.deleteDir()
    opusBuildDir.mkdirs()

    def cmakeArgs = ['cmake', '-B', opusBuildDir.absolutePath, '-S', "$projectDir/opus/opus-${opusVersion}",
                     '-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_POSITION_INDEPENDENT_CODE=ON',
                     '-DOPUS_BUILD_PROGRAMS=OFF', '-DOPUS_BUILD_TESTING=OFF', '-DBUILD_SHARED_LIBS=OFF']
    if (Os.isFamily(Os.FAMILY_MAC) || target == 'darwin') {
      cmakeArgs.add('-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64')
    } else if (target == "linux-armhf" || target == "linux-arm") {
      if (System.getProperty("os.arch") != "arm" && System.getProperty("os.arch") != "aarch64") {
        cmakeArgs.addAll([
            '-DCMAKE_SYSTEM_NAME=Linux',
            '-DCMAKE_SYSTEM_PROCESSOR=arm',
            '-DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc',
            '-DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++',
            '-DCMAKE_C_FLAGS=-march=armv7-a -mfpu=neon -mfloat-abi=hard',
            '-DCMAKE_CXX_FLAGS=-march=armv7-a -mfpu=neon -mfloat-abi=hard'
        ])
      }
    } else if (target == "linux-aarch32") {
      if (System.getProperty("os.arch") != "arm" && System.getProperty("os.arch") != "aarch64") {
        cmakeArgs.addAll([
            '-DCMAKE_SYSTEM_NAME=Linux',
            '-DCMAKE_SYSTEM_PROCESSOR=arm',
            '-DCMAKE_C_COMPILER=arm-linux-gnueabi-gcc',
            '-DCMAKE_CXX_COMPILER=arm-linux-gnueabi-g++',
            '-DCMAKE_C_FLAGS=-march=armv7-a -mfpu=neon -mfloat-abi=softfp',
            '-DCMAKE_CXX_FLAGS=-march=armv7-a -mfpu=neon -mfloat-abi=softfp'
        ])
      }
    } else if (target == "linux-aarch64") {
      if (System.getProperty("os.arch") != "aarch64") {
        cmakeArgs.addAll([
            '-DCMAKE_SYSTEM_NAME=Linux',
            '-DCMAKE_SYSTEM_PROCESSOR=aarch64',
            '-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc',
            '-DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++',
            '-DCMAKE_C_FLAGS=-march=armv8-a',
            '-DCMAKE_CXX_FLAGS=-march=armv8-a'
        ])
      }
    } else if (target == "linux-musl-aarch64") {
      if (System.getProperty("os.arch") != "aarch64") {
        cmakeArgs.addAll([
            '-DCMAKE_SYSTEM_NAME=Linux',
            '-DCMAKE_SYSTEM_PROCESSOR=aarch64',
            '-DCMAKE_C_COMPILER=aarch64-linux-musl-gcc',
            '-DCMAKE_CXX_COMPILER=aarch64-linux-musl-g++',
            '-DCMAKE_C_FLAGS=-march=armv8-a',
            '-DCMAKE_CXX_FLAGS=-march=armv8-a'
        ])
      }
    } else if (target == "linux-x86") {
      cmakeArgs.addAll([
          '-DCMAKE_SYSTEM_NAME=Linux',
          '-DCMAKE_SYSTEM_PROCESSOR=i686',
          '-DCMAKE_C_FLAGS=-m32',
          '-DCMAKE_CXX_FLAGS=-m32'
      ])
    }

    def process = cmakeArgs.execute(null as String[], projectDir)
    waitForAndCheckSuccess(process, "Opus CMake config")

    process = ['cmake', '--build', opusBuildDir.absolutePath, '--config', 'Release'].
        execute(null as String[], projectDir)
    waitForAndCheckSuccess(process, "Opus CMake build")

    copy {
      from "${opusBuildDir.absolutePath}/libopus.a"
      into "$projectDir/libs/${archFolder}"
    }
  }
}

def buildMpg123OnMac(force) {
  def outLib = file("${projectDir}/libs/64/libmpg123.a")
  if (force || !outLib.exists()) {
    file("${projectDir}/libs/64").mkdirs()
    def mpgSrcDir = file("$projectDir/mp3/mpg123-${mpg123Version}")
    def srcPath = mpgSrcDir.absolutePath
    try {
      ["sh", "-c", "touch ${srcPath}/aclocal.m4 ${srcPath}/configure ${srcPath}/src/config.h.in ${srcPath}/Makefile.in"].execute().waitFor()
    } catch (Exception ignored) {}

    def archs = [
        [arch: 'x86_64', host: 'x86_64-apple-darwin'],
        [arch: 'arm64', host: 'aarch64-apple-darwin']
    ]
    def builtLibs = []

    archs.each { item ->
      def buildDirArch = file("$buildDir/mpg123-${item.arch}")
      buildDirArch.deleteDir()
      buildDirArch.mkdirs()

      def flags = "-arch ${item.arch} -fPIC -O3 -fdata-sections -ffunction-sections"
      def configureArgs = [
          "${mpgSrcDir.absolutePath}/configure",
          "--host=${item.host}",
          '--enable-static',
          '--disable-shared',
          '--with-pic',
          '--disable-dependency-tracking',
          '--disable-maintainer-mode',
          "CFLAGS=$flags",
          "CXXFLAGS=$flags",
          "LDFLAGS=-arch ${item.arch}",
          'CC=clang'
      ]

      def process = configureArgs.execute(null as String[], buildDirArch)
      waitForAndCheckSuccess(process, "Mpg123 (${item.arch}) ./configure")

      process = ["make", "-o", "${srcPath}/configure.ac", "-o", "${srcPath}/aclocal.m4", "-o", "${srcPath}/Makefile.am", "-o", "${srcPath}/Makefile.in"].
          execute(null as String[], buildDirArch)
      waitForAndCheckSuccess(process, "Mpg123 (${item.arch}) make")

      builtLibs.add("${buildDirArch.absolutePath}/src/libmpg123/.libs/libmpg123.a")
    }

    def lipoArgs = ['lipo', '-create'] + builtLibs + ['-output', outLib.absolutePath]
    def lipoProc = lipoArgs.execute(null as String[], projectDir)
    waitForAndCheckSuccess(lipoProc, "Mpg123 lipo")
  }
}

def buildMpg123OnLinux(force) {
  def target = project.findProperty('nativeTarget') ?: System.getenv('NATIVE_TARGET')
  def is32Bit = (target == "linux-x86" || target == "linux-armhf" || target == "linux-arm" || target == "linux-aarch32")
  def archFolder = is32Bit ? "32" : "64"
  def present = file("${projectDir}/libs/${archFolder}/libmpg123.a").exists()

  if (force || !present) {
    file("${projectDir}/libs/${archFolder}").mkdirs()
    def mpgDir = file("$projectDir/mp3/mpg123-${mpg123Version}")
    def srcPath = mpgDir.absolutePath
    try {
      ["sh", "-c", "find ${srcPath} -name Makefile.in -exec touch {} +; touch ${srcPath}/aclocal.m4 ${srcPath}/configure ${srcPath}/src/config.h.in"].execute().waitFor()
    } catch (Exception ignored) {}

    def flags = "-fPIC -O3 -fdata-sections -ffunction-sections"
    if (is32Bit && target == "linux-x86") {
      flags += " -m32"
    } else if (target == "linux-armhf" || target == "linux-arm") {
      flags += " -march=armv7-a -mfpu=neon -mfloat-abi=hard"
    } else if (target == "linux-aarch32") {
      flags += " -march=armv7-a -mfpu=neon -mfloat-abi=softfp"
    }
    def configureArgs = ['./configure', '--enable-static', '--disable-shared', '--with-pic',
                         '--disable-dependency-tracking', '--disable-maintainer-mode',
                         "CFLAGS=$flags", "CXXFLAGS=$flags"]
    if (target == "linux-x86") {
      configureArgs.add('--host=i686-linux-gnu')
    } else if (target == "linux-armhf" || target == "linux-arm") {
      if (System.getProperty("os.arch") != "arm" && System.getProperty("os.arch") != "aarch64") {
        configureArgs.add('--host=arm-linux-gnueabihf')
        configureArgs.add('CC=arm-linux-gnueabihf-gcc')
      }
    } else if (target == "linux-aarch32") {
      if (System.getProperty("os.arch") != "arm" && System.getProperty("os.arch") != "aarch64") {
        configureArgs.add('--host=arm-linux-gnueabi')
        configureArgs.add('CC=arm-linux-gnueabi-gcc')
      }
    } else if (target == "linux-aarch64") {
      if (System.getProperty("os.arch") != "aarch64") {
        configureArgs.add('--host=aarch64-linux-gnu')
        configureArgs.add('CC=aarch64-linux-gnu-gcc')
      }
    } else if (target == "linux-musl-aarch64") {
      if (System.getProperty("os.arch") != "aarch64") {
        configureArgs.add('--host=aarch64-linux-musl')
        configureArgs.add('CC=aarch64-linux-musl-gcc')
      }
    }
    def process = configureArgs.execute(null as String[], mpgDir)

    waitForAndCheckSuccess(process, "Mpg123 ./configure")

    process = ["make", "-o", "configure.ac", "-o", "aclocal.m4", "-o", "Makefile.am", "-o", "Makefile.in", "-o", "src/config.h.in", "clean"].
        execute(null as String[], mpgDir)
    waitForAndCheckSuccess(process, "make clean")

    process = ["make", "-o", "configure.ac", "-o", "aclocal.m4", "-o", "Makefile.am", "-o", "Makefile.in", "-o", "src/config.h.in"].
        execute(null as String[], mpgDir)
    waitForAndCheckSuccess(process, "make")

    copy {
      from "$projectDir/mp3/mpg123-${mpg123Version}/src/libmpg123/.libs/libmpg123.a"
      into "$projectDir/libs/${archFolder}"
    }
  }
}

def prepareOggOnLinux(force) {
  def target = project.findProperty('nativeTarget') ?: System.getenv('NATIVE_TARGET')
  def oggDir = file("$projectDir/vorbis/libogg-${oggVersion}")
  def configured = file("$oggDir/include/ogg/config_types.h").exists()

  if (force || !configured) {
    def configureArgs = ["./configure", "--enable-static", "--disable-shared", "--with-pic",
                         "--disable-dependency-tracking"]
    if (target == "linux-armhf" || target == "linux-arm") {
      if (System.getProperty("os.arch") != "arm" && System.getProperty("os.arch") != "aarch64") {
        configureArgs.add("--host=arm-linux-gnueabihf")
        configureArgs.add("CC=arm-linux-gnueabihf-gcc")
        configureArgs.add("CFLAGS=-march=armv7-a -mfpu=neon -mfloat-abi=hard -fPIC")
      }
    } else if (target == "linux-aarch32") {
      if (System.getProperty("os.arch") != "arm" && System.getProperty("os.arch") != "aarch64") {
        configureArgs.add("--host=arm-linux-gnueabi")
        configureArgs.add("CC=arm-linux-gnueabi-gcc")
        configureArgs.add("CFLAGS=-march=armv7-a -mfpu=neon -mfloat-abi=softfp -fPIC")
      }
    } else if (target == "linux-aarch64") {
      if (System.getProperty("os.arch") != "aarch64") {
        configureArgs.add("--host=aarch64-linux-gnu")
        configureArgs.add("CC=aarch64-linux-gnu-gcc")
        configureArgs.add("CFLAGS=-march=armv8-a -fPIC")
      }
    } else if (target == "linux-musl-aarch64") {
      if (System.getProperty("os.arch") != "aarch64") {
        configureArgs.add("--host=aarch64-linux-musl")
        configureArgs.add("CC=aarch64-linux-musl-gcc")
        configureArgs.add("CFLAGS=-march=armv8-a -fPIC")
      }
    } else if (target == "linux-x86") {
      configureArgs.add("--host=i686-linux-gnu")
      configureArgs.add("CFLAGS=-m32 -fPIC")
    }
    def process = configureArgs.execute(null as String[], oggDir)

    process.waitForProcessOutput(System.out as Appendable, System.err)
  }
}

def prepareBuilds(force) {
  def target = project.findProperty('nativeTarget') ?: System.getenv('NATIVE_TARGET')
  if (Os.isFamily(Os.FAMILY_WINDOWS) && target != 'darwin' && !target?.startsWith('linux-')) {
    buildOpusOnWindows(force)
    buildMpg123OnWindows(force)
  } else if (Os.isFamily(Os.FAMILY_MAC) || target == 'darwin') {
    prepareOggOnLinux(force)
    buildOpusOnLinux(force)
    buildMpg123OnMac(force)
  } else {
    prepareOggOnLinux(force)
    buildOpusOnLinux(force)
    buildMpg123OnLinux(force)
  }
}

task compileNatives() { }
task checkNatives() { }

def buildTaskConfig = [
    buildBase: buildDir,
    projectBase: projectDir,
    deployBase: project(':natives-publish').projectDir,
    setupDependency: tasks.load,
    setupDoFirst: { config -> prepareBuilds(false) },
    compileTask: tasks.compileNatives,
    checkTask: tasks.checkNatives,
    name: 'connector'
]

createBuildTask(tasks, buildTaskConfig)
